name: Scholarship Crawler

on:
  schedule:
    - cron: "30 2 * * *"  # Daily at 2:30 AM UTC
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run crawler (rule-based only, no LLM)
        run: python -m src.run_crawl --no-llm --max-pages 100
      - name: Commit database update
        run: |
          git config user.name "ScholarshipBot"
          git config user.email "bot@example.com"
          git add data/scholarships.db data/snapshots/ || true
          git commit -m "Crawl run $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push || true
