scoring:
  official_source:
    official_domain: 20
    allowlisted: 16
    unknown: 0
  present_on_source: 15
  application_url: 10
  eligibility: 15
  deadline: 10
  freshness:
    max_7_days: 5
    max_30_days: 3
    older: 0
  no_conflict: 10
  consistency: 10
  traceability: 5

thresholds:
  verified_min_score: 95.0
  name_match_min: 90
  link_relevance_min: 3
  max_discovery_depth: 2
  max_links_per_page: 50
  request_delay_seconds: 2.5
  request_timeout_seconds: 15
  max_retries: 3
  expiring_soon_days: 15
  stale_runs_before_no_longer_verifiable: 2

llm:
  enabled: false
  model: "llama3.1:8b"
  base_url: "http://localhost:11434"
  temperature: 0
  max_text_chars: 12000

crawler:
  user_agent: "ScholarshipCrawler/1.0 (educational research; contact: scholar@example.com)"
  max_pages_per_run: 200
